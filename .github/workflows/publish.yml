name: Publish to PyPI

# Publishes the sdist and wheel when a GitHub release is published. Uses PyPI trusted publishing:
# register this repository and workflow as a trusted publisher for the project on PyPI first.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
