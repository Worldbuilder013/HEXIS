<svg xmlns="http://www.w3.org/2000/svg" width="1280pt" height="900pt" viewBox="0 0 1280 900">
<title>Following the same skill requirement</title>
<desc>The skill says to execute operation b next if condition c holds. The same result, c true, is shown on both sides. Native execution uses model inference to select the next operation; annotations show where SkillOpt edits the skill document and Reflexion or AWM add experience to its inputs. The model selects b with probability 1 minus epsilon_t, or an operation other than b with probability epsilon_t. The figure defines epsilon_t as the probability of selecting an operation other than b when b is required at step t. In hexis, the current state records the result. A diamond denotes the program evaluating transition condition c from that result, rather than a separate state or model inference. The true branch leads to the next state, which executes b. The false branch leads to a Retry state, with a dashed return arrow to the Current state. This retry loop is inactive for the displayed result. Blue denotes model inference, green denotes program evaluation and its selected transition, red denotes deviation from the requirement, and gray denotes the inactive branch. Inputs and states are neutral.</desc>
