[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hexis-agent"
dynamic = ["version"]
description = "Compile agent skills into extended finite state machines."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Anonymous Authors" }]
keywords = ["agents", "agent skills", "state machines", "EFSM", "LLM", "compilation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2", "twine>=6.1", "ruff>=0.6"]

[project.scripts]
hexis-agent = "hexis.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hexis.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hexis.tools.backends" = ["*.json"]
"hexis.examples.table_clean" = ["SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# syntax errors and undefined names; style is not enforced
select = ["E9", "F63", "F7", "F82"]
