[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill2fsm"
dynamic = ["version"]
description = "Compile agent skills into extended finite state machines."
readme = "README.md"
requires-python = ">=3.11"
# MIT, except the portions listed in THIRD_PARTY_NOTICES.md
license = "MIT AND CC-BY-SA-4.0 AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Anonymous Authors" }]
keywords = ["agents", "agent skills", "state machines", "EFSM", "LLM", "compilation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]                                   # SpreadsheetBench grading
memory = ["numpy>=1.26", "sentence-transformers>=2.7"]     # ReasoningBank embedding index
all = ["skill2fsm[xlsx,memory]"]
dev = ["pytest>=8.0", "build>=1.2", "twine>=6.1"]

[project.scripts]
skill2fsm = "skill2fsm.cli:main"

[tool.setuptools.dynamic]
version = { attr = "skill2fsm.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"skill2fsm.backends" = ["*.json"]
"skill2fsm.examples.table_clean" = ["SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
